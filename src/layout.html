<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="robots" content="{{ROBOTS}}" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <title>{{TITLE}}</title>
    <link rel="canonical" href="{{CANONICAL}}" />
    <link rel="alternate" hreflang="es" href="https://untricot.com/" />
    <link rel="alternate" hreflang="en" href="https://untricot.com/en/" />
    <link rel="alternate" hreflang="x-default" href="https://untricot.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TRICOT" />
    <meta property="og:locale" content="{{OG_LOCALE}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <link rel="icon" href="/assets/brand/favicon-t.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <script type="application/ld+json">{{JSON_LD}}</script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">{{SKIP_LINK}}</a>
    <header class="site-header" data-header>
      <a class="brand" href="{{HOME_URL}}" aria-label="{{BRAND_LABEL}}"><img src="/assets/brand/tricot-wordmark-600.webp" srcset="/assets/brand/tricot-wordmark-600.webp 600w, /assets/brand/tricot-wordmark-900.webp 900w" sizes="140px" alt="TRICOT" width="140" height="42" /></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>{{MENU_LABEL}} <span aria-hidden="true">＋</span></button>
      <nav class="site-nav" id="site-nav" aria-label="{{NAV_LABEL}}" data-nav>
        <a href="{{APPLICATIONS_URL}}">{{NAV_APPLICATIONS}}</a>
        <a href="{{JOURNEY_URL}}">{{NAV_JOURNEY}}</a>
        <a href="{{IMPLEMENTATION_URL}}">{{NAV_IMPLEMENTATION}}</a>
        <a href="#contacto">{{NAV_CONTACT}}</a>
        <a class="language-link" href="{{LANGUAGE_URL}}" lang="{{OTHER_LANG}}" hreflang="{{OTHER_LANG}}" aria-label="{{LANGUAGE_LABEL}}">{{OTHER_LANG_UPPER}}</a>
      </nav>
    </header>
{{BODY}}
    <footer class="site-footer">
      <a class="brand" href="{{HOME_URL}}" aria-label="{{BRAND_LABEL}}"><img src="/assets/brand/tricot-wordmark-600.webp" srcset="/assets/brand/tricot-wordmark-600.webp 600w, /assets/brand/tricot-wordmark-900.webp 900w" sizes="160px" alt="TRICOT" width="160" height="48" loading="lazy" decoding="async" /></a>
      <p>{{FOOTER_DESCRIPTOR}}</p>
      <a href="#inicio">{{BACK_TO_TOP}}</a>
      <small>© <span data-year></span> TRICOT</small>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
